id: productanalytics
name: ProductAnalytics
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
      externalEntraExchange: true
    password:
      enabled: false
    allowedRedirectUris:
      - http://localhost:5173
      - http://127.0.0.1:5173
      - https://loyal-delta-240863046f-centralindia.webapp.fabricapps.net
  data:
    enabled: false
    path: packages/data
    buildCommand: npm run build
  staticHosting:
    enabled: true
    path: packages/frontend
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
    assetAccess: protected
    embedded:
      only: false
  storage:
    enabled: false
  functions:
    enabled: false
connectors:
  - name: productlakehouse
    type: fabric-sqlanalytics
    config:
      workspaceId: c610f482-ec06-43ad-9174-2e83b8e8ec20
      itemId: 7e76fd31-a7cd-4a02-a40e-1a65d56252fe
    auth:
      type: application
    operations:
      - name: read
